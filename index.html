<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Add to <head> -->
        <link
            href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
            rel="stylesheet"
        />
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>Calculator</h1>
        </header>

        <main>
            <div class="container">
                <div id="calcHeader">
                    <p id="left">brito</p>
                    <div id="right">
                        <div id="solarPanel"></div>
                    </div>
                </div>
                <div id="visor"></div>
                <div id="middle"><p id="model">Calc Model</p>
                    <button id="sqr">Sqrt</button>
                    <button id="off">Off</button>
                </div>
                <div id="keyboard">
                    <div id="column_1">
                        <button id="mc">MC</button>
                        <button id="percentage">%</button>
                        <button id="more-less">+/-</button>
                        <button id="clear">CLR</button>
                        <button id="ac">AC</button>
                    </div>
                    <div id="column_2">
                        <button id="mr">MR</button>
                        <button id="seven">7</button>
                        <button id="four">4</button>
                        <button id="one">1</button>
                        <button id="zero">0</button>
                    </div>
                    <div id="column_3">
                        <button id="m-">M-</button>
                        <button id="eight">8</button>
                        <button id="five">5</button>
                        <button id="two">2</button>
                        <button id="point">.</button>
                    </div>
                    <div id="column_4">

                        <button id="m+">M+</button>
                        <button id="nine">9</button>
                        <button id="six">6</button>
                        <button id="three">3</button>
                        <button id="equal">=</button>
                    </div>
                    <div id="column_5">

                        <button id="division">/</button>
                        <button id="times">*</button>
                        <button id="minus">-</button>
                        <button id="sum">+</button>
                    </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>&copy; 2026 Cabrito. All rights reserved.</footer>
        <script src="script.js"></script>
    </body>
</html>
